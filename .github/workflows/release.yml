name: Build release

# Cutting a tag builds the signed release APKs and publishes them as a
# GitHub release; the in-app updater reads the same release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with the pinned mihomo core
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go for the mihomo bridge
        uses: actions/setup-go@v5
        with:
          go-version-file: core/mihomo-bridge/go.mod
          cache: true
          cache-dependency-path: |
            core/mihomo-bridge/go.sum
            core/mihomo/go.sum

      - name: Install the pinned Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;29.0.13599879" "cmake;3.22.1"

      - name: Restore the release signing keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APKs
        run: |
          chmod +x gradlew
          # The version code grows by exactly one per published release: read
          # the previous release's version.json and increment. The run number
          # is not used because cancelled or re-run workflows would skip codes.
          PREV_CODE=$(curl -fsSL \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | jq -r '.assets[]? | select(.name=="version.json") | .browser_download_url' \
            | head -1 | xargs -r curl -fsSL \
            | jq -r '.versionCode // empty' 2>/dev/null || true)
          # v0.1.0-miku-1, the last release published without version.json, was 1003.
          [ -z "$PREV_CODE" ] && PREV_CODE=1003
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$((PREV_CODE + 1))
          echo "VERSION_NAME=$VERSION_NAME VERSION_CODE=$VERSION_CODE (prev: $PREV_CODE)"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PversionNameOverride="$VERSION_NAME" \
            -PversionCodeOverride="$VERSION_CODE"
          # The updater compares the release's version code with the installed
          # one; publish it as a tiny asset next to the APKs.
          printf '{"versionCode": %d, "versionName": "%s"}\n' \
            "$VERSION_CODE" "$VERSION_NAME" \
            > app/build/outputs/apk/release/version.json
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}

      - name: Rename APKs to mikubox-<tag>-<abi>
        run: |
          cd app/build/outputs/apk/release
          for apk in app-*-release.apk; do
            abi="${apk#app-}"
            mv "$apk" "mikubox-${GITHUB_REF_NAME}-${abi%-release.apk}.apk"
          done
          ls -1 ./*.apk

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/mikubox-*.apk
            app/build/outputs/apk/release/version.json
