org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# The ported MikuRay screens are written against resource names that now live in
# :mikuray-ui and :remixicon, so one merged R namespace keeps their Kotlin
# readable (R.layout.uwu_mid rather than com.miku.ray.res.R.layout.uwu_mid) and
# matches how the vendored XML addresses them.
android.nonTransitiveRClass=false

kotlin.code.style=official
